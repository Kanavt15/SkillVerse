# Weekly dependency update PRs, grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*', 'workerd']
      react:
        patterns: ['react', 'react-dom', 'react-router', '@react-router/*', '@types/react*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier', 'vitest', 'vite', '@vitest/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
